app:
  id: ari:cloud:ecosystem::app/ff573101-2609-4a69-9c7f-992ffca28401
  runtime:
    name: nodejs22.x

modules:
  jira:globalPage:
    - key: superchat-jira-global
      resource: superchat-native
      render: native
      resolver:
        function: resolver
      title: A9 Superchat

  confluence:globalPage:
    - key: superchat-confluence-global
      resource: superchat-native
      render: native
      route: superchat
      resolver:
        function: resolver
      title: A9 Superchat

  jira:adminPage:
    - key: superchat-jira-admin
      resource: superchat-native
      render: native
      resolver:
        function: resolver
      title: A9 Superchat Admin

  webtrigger:
    - key: superchat-incident-ingest
      function: incident-ingest
      urlFormat: v2
      response:
        type: dynamic
    - key: superchat-irc-command
      function: irc-command
      urlFormat: v2
      response:
        type: dynamic
    - key: superchat-irc-event
      function: irc-event
      urlFormat: v2
      response:
        type: dynamic

  rovo:agent:
    - key: superchat-incident-agent
      name: A9 Superchat Channel Operator
      description: Uses A9 Superchat to bring Rovo into IRC incident channels, ask focused triage questions, and distill channel work into RCA or best-practice drafts.
      prompt: resource:rovo-resources;prompts/incident-agent.txt
      conversationStarters:
        - Ask #a9superchat what evidence is missing for a Jira incident
        - Distill #atlassian into an RCA draft
        - Show how A9 Superchat bridges IRC, Jira, Confluence, and Rovo
      actions:
        - superchat-triage-action
        - superchat-channel-summary-action

  action:
    - key: superchat-triage-action
      name: Ask A9 Superchat channel
      function: rovo-triage
      actionVerb: GET
      description: Queues a focused Jira-grounded triage question for an IRC channel in A9 Superchat.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: true
          description: The Jira issue key to use for incident context, for example CS-123.
        channel:
          title: IRC channel
          type: string
          required: true
          description: The IRC channel where the triage question should be posted.
        question:
          title: Question
          type: string
          required: true
          description: The focused triage question the agent should ask in IRC.
    - key: superchat-channel-summary-action
      name: Distill A9 Superchat channel
      function: rovo-channel-summary
      actionVerb: GET
      description: Queues channel distillation for RCA, timeline, best-practice, or action-item output.
      inputs:
        channel:
          title: IRC channel
          type: string
          required: true
          description: The IRC channel whose retained transcript should be summarized.
        format:
          title: Output format
          type: string
          required: false
          description: The requested summary format, such as rca or best-practice.

  function:
    - key: resolver
      handler: index.handler
    - key: incident-ingest
      handler: index.incidentIngest
    - key: irc-command
      handler: index.ircCommand
    - key: irc-event
      handler: index.ircEvent
    - key: rovo-triage
      handler: index.rovoTriageAction
    - key: rovo-channel-summary
      handler: index.rovoChannelSummaryAction

resources:
  - key: superchat-native
    path: src/frontend/index.jsx
  - key: rovo-resources
    path: resources/rovo

permissions:
  scopes:
    - storage:app
    - read:jira-user
    - read:jira-work
    - read:confluence-user
    - read:confluence-content.summary
    - read:chat:rovo
  external:
    fetch:
      backend:
        - address: "wss://irc.unrealircd.org:8000"
          inScopeEUD: true
        - address: "*.superchat-relay.example.com"
          inScopeEUD: true
      client:
        - address: "wss://testnet.ergo.chat"
          inScopeEUD: true
        - address: "wss://testnet.inspircd.org:8097"
          inScopeEUD: true
        - address: "wss://irc.unrealircd.org:7000"
          inScopeEUD: true
        - address: "wss://irc.unrealircd.org:8000"
          inScopeEUD: true
        - address: "*.superchat-relay.example.com"
          inScopeEUD: true
