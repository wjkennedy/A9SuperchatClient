<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>A9 Superchat IRC Gateway</title>
	<link rel="icon" href="./include/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="./include/style.css">
</head>
<body class="console-open">
	<button id="console-launcher" type="button" title="Open A9 Superchat console">~ A9 Superchat</button>
	<div id="console-modal" role="dialog" aria-modal="true" aria-label="A9 Superchat console">
		<div id="console-bar">
			<span id="console-title">A9 Superchat</span>
			<button id="console-close" type="button" title="Close console">~</button>
		</div>
		<div id="login">
			<div id="login-box">
				<a href="https://github.com/wjkennedy" target="_blank" rel="noopener" id="login-title-link"><div id="login-title">A9 Superchat IRC</div></a>
				<input type="text" id="login-server" placeholder="Server" spellcheck="false" autocapitalize="off" autocomplete="off" value="irc.unrealircd.org">
				<div id="login-row">
					<input type="number" id="login-port" placeholder="Port" min="1" max="65535" value="8000">
					<label id="login-ssl-label"><input type="checkbox" id="login-ssl" checked> SSL/TLS</label>
				</div>
				<div id="login-note">Requires a WebSocket port <small><i>(not 6667/6697)</i></small></div>
				<input type="text" id="login-nick" placeholder="Nickname" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="20">
				<input type="text" id="login-channels" placeholder="Channels (e.g. #dev,#comms)" spellcheck="false" autocapitalize="off" autocomplete="off" value="#dev,#comms,#exchange,#hardchats,#scroll,#superbowl">
				<label id="login-remember-label"><input type="checkbox" id="login-remember"> Remember my settings</label>
				<button id="login-btn">Connect</button>
				<div id="wstester" class="setup-panel">
					<div class="setup-panel-header">
						<h2>WebSocket Tester</h2>
						<button id="wstester-apply" type="button">Use URL</button>
					</div>
					<div class="wstester-presets" aria-label="Server presets">
						<button type="button" class="wstester-preset" data-url="wss://testnet.ergo.chat/webirc" data-wstype="text">Ergo</button>
						<button type="button" class="wstester-preset" data-url="wss://testnet.inspircd.org:8097" data-wstype="binary">InspIRCd</button>
						<button type="button" class="wstester-preset" data-url="wss://irc.unrealircd.org:8000" data-wstype="text">UnrealIRCd</button>
					</div>
					<label class="setup-label" for="wstester-network">WebSocket URL</label>
					<input type="text" id="wstester-network" value="wss://irc.unrealircd.org:8000" spellcheck="false" autocapitalize="off" autocomplete="off">
					<label class="setup-label" for="wstester-nick">Nickname</label>
					<input type="text" id="wstester-nick" spellcheck="false" autocapitalize="off" autocomplete="off">
					<div class="wstester-radio-row">
						<label><input type="radio" id="wstester-type-text" name="wstester-type" value="text" checked> Text</label>
						<label><input type="radio" id="wstester-type-binary" name="wstester-type" value="binary"> Binary</label>
						<label><input type="radio" id="wstester-type-none" name="wstester-type" value="none"> Empty</label>
					</div>
					<div class="wstester-actions">
						<button id="wstester-connect" type="button">Connect</button>
						<button id="wstester-disconnect" type="button" disabled>Disconnect</button>
						<button id="wstester-copy" type="button">Copy Code</button>
					</div>
					<pre id="wstester-code"></pre>
					<pre id="wstester-log">... irc lines will go here ...</pre>
					<div class="wstester-send-row">
						<input type="text" id="wstester-line" placeholder="Raw IRC line" spellcheck="false" autocapitalize="off" autocomplete="off">
						<button id="wstester-send" type="button">Send</button>
					</div>
					<div class="wstester-options">
						<label><input type="checkbox" id="wstester-follow" checked> Follow new lines</label>
						<label><input type="checkbox" id="wstester-pongs" checked> Respond to PINGs</label>
					</div>
				</div>
			</div>
		</div>
		<div id="app" class="hidden">
			<div id="main">
				<div id="channels"></div>
				<div id="chat-area">
					<div id="topicbar" class="hidden"></div>
					<div id="messages"></div>
				</div>
				<div id="nicklist"></div>
			</div>
			<div id="statusbar">
				<span id="toggle-chanlist" title="Toggle channel list"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></span>
				<span id="font-decrease" class="mobile-only" title="Decrease font size">A-</span>
				<span id="font-increase" class="mobile-only" title="Increase font size">A+</span>
				<span id="toggle-nicklist" title="Toggle nick list"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5" r="2.5"/><path d="M3 14.5c0-3 2.2-5 5-5s5 2 5 5"/></svg></span>
			</div>
			<div id="input-row">
				<span id="input-nick"></span>
				<input type="text" id="input" placeholder="Type here..." spellcheck="false" autocapitalize="off" autocomplete="off">
			</div>
		</div>
	</div>
	<script src="./include/script.js"></script>
</body>
</html>
